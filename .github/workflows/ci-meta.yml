name: CI and Meta deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test game, translations, and Node uploader
        run: npm test
      - name: Build game
        run: npm run build
      - name: Save tested bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meta-game-${{ github.sha }}
          path: tuna-escape.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Upload and promote verified build
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download the exact bundle that passed verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-game-${{ github.sha }}
      - name: Upload and switch to production
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_UPLOAD_TOKEN: ${{ secrets.META_UPLOAD_TOKEN }}
          META_BUILD_COMMENT: TUNA ESCAPE ${{ github.sha }}
        run: |
          node scripts/upload.mjs
          echo 'Meta accepted production promotion for the bundle uploaded in this run.' >> "$GITHUB_STEP_SUMMARY"
