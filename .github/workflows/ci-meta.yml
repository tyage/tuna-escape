name: CI and Meta upload

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_instance_id:
        description: 'Existing Meta bundle to promote to production; leave empty to upload only'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test game, translations, and Node uploader
        run: npm test
      - name: Build game
        run: npm run build
      - name: Save tested bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meta-game-${{ github.sha }}
          path: maguro-escape.zip
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Upload verified build to Meta
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.bundle_instance_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download the exact bundle that passed verification
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: meta-game-${{ github.sha }}
      - name: Upload to Meta
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_BUILD_COMMENT: TUNA ESCAPE ${{ github.sha }}
        run: |
          if [ -z "$META_APP_ID" ] || [ -z "$META_APP_SECRET" ]; then
            echo '::error::Set repository Actions secrets META_APP_ID and META_APP_SECRET.'
            exit 1
          fi
          node scripts/upload.mjs
          echo 'Meta accepted the uploaded build. Production has not been promoted by this job.' >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote existing Meta build to production
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.bundle_instance_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Promote selected bundle
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUNDLE_INSTANCE_ID: ${{ inputs.bundle_instance_id }}
        run: |
          node scripts/upload.mjs --promote "$BUNDLE_INSTANCE_ID"
          echo 'Meta accepted the production promotion request. Verify the served version.' >> "$GITHUB_STEP_SUMMARY"
